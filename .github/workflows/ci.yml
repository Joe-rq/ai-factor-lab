name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --group dev
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Ruff check
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest
      - name: Structure check
        run: uv run python scripts/check-structure.py
      - name: Hygiene scan
        run: uv run python scripts/check-hygiene.py
